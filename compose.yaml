# Use postgres/example user/password credentials

serjvices:

  postgres:
    image: postgres
    container_name: nest_postgres
    restart: always
   
    shm_size: 128mb

    environment: 
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: contraseña
      POSTGRES_DB: nest_bd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data


  nes-app: 
    build: .
    container_name: nest_api
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: contraseña
      DB_NAME: nest_bd 

volumes:
  pgdata:
