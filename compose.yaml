# Use postgres/example user/password credentials

services:

  postgres:
    image: postgres
    container_name: nest_postgres
    restart: always
   
    environment: 
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: contraseña
      POSTGRES_DB: nest_bd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql


volumes:
  pgdata:
